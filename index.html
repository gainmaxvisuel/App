<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VORTEX — Administration</title>
<style>
:root{color-scheme:dark;--bg:#071225;--panel:#0d1d36;--line:#1e3859;--cyan:#20d7e8;--gold:#f7c84a;--muted:#9db0c9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 15% 5%,#12345a 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#083d50 0,transparent 35%),var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f8ff}.wrap{width:min(100%,430px)}.brand{text-align:center;margin-bottom:26px}.logo{width:74px;height:74px;margin:auto auto 12px;border-radius:23px;display:grid;place-items:center;font-size:43px;font-weight:900;color:#071225;background:linear-gradient(145deg,#fff0a3,var(--gold) 55%,#d38c19);box-shadow:0 0 36px #f7c84a30}.brand h1{font-size:30px;letter-spacing:4px;margin:0}.brand p{margin:8px 0 0;color:var(--muted);font-size:13px;letter-spacing:1.4px;text-transform:uppercase}.card{background:linear-gradient(155deg,#102441f5,#09172bf5);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 22px 70px #0006}.eyebrow{color:var(--cyan);font-size:11px;letter-spacing:2px;font-weight:800;text-transform:uppercase}.card h2{margin:8px 0 7px;font-size:25px}.sub{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 24px}label{display:block;font-size:13px;font-weight:650;margin:0 0 8px;color:#dce8f8}.field{margin-bottom:18px}input{width:100%;padding:14px 15px;border:1px solid #294361;border-radius:12px;background:#071326;color:#fff;font-size:15px;outline:none}input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #20d7e81b}input::placeholder{color:#7187a3}.password{position:relative}.password input{padding-right:54px}.toggle{position:absolute;right:8px;top:7px;border:0;background:transparent;color:#a8bed8;padding:8px;cursor:pointer;font-size:12px}.submit{width:100%;border:0;border-radius:12px;padding:15px 18px;font-weight:850;font-size:15px;color:#061326;background:linear-gradient(100deg,#ffe18a,var(--gold));cursor:pointer;box-shadow:0 8px 24px #f7c84a20}.submit:active{transform:translateY(1px)}.notice{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#3b2024;border:1px solid #79383e;color:#ffd6d9;font-size:13px;line-height:1.5}.secure{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 0}.secure span{color:#66e1b3}.foot{text-align:center;color:#7086a3;font-size:11px;margin-top:20px}
</style></head>
<body><main class="wrap"><header class="brand"><div class="logo">V</div><h1>VORTEX</h1><p>Administration · Investir aujourd'hui, bâtir demain</p></header><section class="card"><div class="eyebrow">Espace sécurisé</div><h2>Connexion administrateur</h2><p class="sub">Connectez-vous avec vos identifiants d’administration pour accéder au panel VORTEX.</p><form id="loginForm"><div class="field"><label for="username">Identifiant</label><input id="username" name="username" autocomplete="username" placeholder="Votre identifiant administrateur" required></div><div class="field"><label for="password">Mot de passe</label><div class="password"><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Votre mot de passe" required><button class="toggle" id="toggle" type="button">Afficher</button></div></div><button class="submit" type="submit">Se connecter <span aria-hidden="true">→</span></button><div class="notice" id="notice" role="alert"></div></form><p class="secure">◈ <span>Accès réservé au personnel autorisé</span></p></section><div class="foot">VORTEX © 2026 · Panel d’administration</div></main>
<script>
const form=document.getElementById('loginForm'),notice=document.getElementById('notice'),pass=document.getElementById('password');
document.getElementById('toggle').addEventListener('click',()=>{const show=pass.type==='password';pass.type=show?'text':'password';document.getElementById('toggle').textContent=show?'Masquer':'Afficher'});
form.addEventListener('submit',e=>{e.preventDefault();notice.style.display='block';notice.textContent='La page de connexion est prête visuellement, mais l’authentification serveur des administrateurs doit encore être raccordée avant toute connexion réelle.';});
</script></body></html>
